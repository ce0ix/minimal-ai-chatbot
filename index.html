<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Minimal AI Chatbot</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width:720px; margin:2rem auto; padding:0 1rem }
    .chat { border:1px solid #ddd; padding:1rem; border-radius:8px; min-height:200px }
    .msg { margin:0.5rem 0 }
    .user { font-weight:600 }
    .assistant { color:#0b74de }
    textarea{ width:100%; height:80px }
    button{ margin-top:0.5rem }
  </style>
</head>
<body>
  <h1>Minimal AI Chatbot</h1>
  <div class="chat" id="chat"></div>

  <textarea id="input" placeholder="Mesajınızı yazın..."></textarea>
  <br />
  <button id="send">Gönder</button>

  <script>
    const chat = document.getElementById('chat')
    const input = document.getElementById('input')
    const send = document.getElementById('send')

    const messages = []

    function render() {
      chat.innerHTML = ''
      for (const m of messages) {
        const d = document.createElement('div')
        d.className = 'msg '
        d.innerHTML = `<div class="${m.role}"><strong>${m.role}:</strong> ${m.content}</div>`
        chat.appendChild(d)
      }
      chat.scrollTop = chat.scrollHeight
    }

    async function sendMessage() {
      const text = input.value.trim()
      if (!text) return
      messages.push({ role: 'user', content: text })
      render()
      input.value = ''

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      })
      const j = await res.json()
      messages.push({ role: 'assistant', content: j.reply })
      render()
    }

    send.addEventListener('click', sendMessage)
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey||e.metaKey)) sendMessage() })

    messages.push({ role: 'assistant', content: 'Merhaba! Bana bir şey yazıp Gönder butonuna basabilirsin.' })
    render()
  </script>
</body>
</html>
